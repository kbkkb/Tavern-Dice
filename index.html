<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>酒馆骰局 · Tavern Dice</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages.css">
<script>
// Lucide 异步加载，任何网络环境下都不阻塞页面；加载完成后补画图标
var lucideScript = document.createElement('script');
lucideScript.src = 'https://unpkg.com/lucide@latest/dist/umd/lucide.min.js';
lucideScript.async = true;
lucideScript.onload = function(){ if (window.lucide) lucide.createIcons(); };
lucideScript.onerror = function(){ window.lucide = null; };
document.head.appendChild(lucideScript);
</script>
</head>
<body>
<div id="candle-glow"></div>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
// 调试：把 JS 错误直接画到页面上，方便定位
window.addEventListener('error', function(e){
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#400;color:#fff;padding:10px;font-size:12px;z-index:9999;white-space:pre-wrap';
  d.textContent = 'JS 错误: ' + e.message + ' @ ' + (e.filename||'') + ':' + (e.lineno||'');
  document.body.appendChild(d);
});
</script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
